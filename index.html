    <!-- Primary Meta (homepage defaults; react-helmet-async sets per-route
         title/description/canonical/OG at runtime; no static canonical here
         so Helmet is the single canonical source and never conflicts). -->
    <title>Ziiro AI: Diagnose, Build, Optimize | AI That Earns Its Cost</title>
    <meta name="description" content="Ziiro AI is an AI consultancy that works in three stages. Diagnose maps how the operation runs and prices the opportunity, Build ships agents into it, and Optimize keeps them measured and tuned." />

    <meta name="author" content="Ziiro AI" />
    <meta name="robots" content="index, follow" />
    <!-- The hero's entrance hides its own elements until anime.js reveals
         them. That hiding is gated on this class, so the prerendered HTML a
         non-JS crawler receives has every word of the hero visible. -->
    <script>document.documentElement.classList.add("js");</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load font CSS async so it doesn't block first paint.

         Two families are downloaded, and only two. The text face is Helvetica,
         which every target platform already has, so headlines and body cost no
         request at all: macOS and iOS resolve Helvetica Neue, Windows falls
         back to Arial, which is metrically identical. Instrument Sans and Inter
         used to be fetched here and are gone with the faces they served.

         What is left has to be fetched because nothing local can stand in:
         Space Mono for the tracked uppercase micro-labels, and Instrument
         Serif, upright and italic, for the pull-quote figures. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />
    </noscript>
