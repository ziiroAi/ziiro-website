name: CodeQL

# This repository is TypeScript and JavaScript only: the React and Vite site in
# src/, and the Vercel edge functions in api/. That is one CodeQL language, so
# the matrix below has one entry.
#
# main is protected and takes changes only through pull requests, and dev is the
# integration branch where work lands first. Scanning both means a finding shows
# up while it is still on dev, not after it has reached production.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Mondays at 03:27 UTC, off the hour because on-the-hour slots are the most
    # contended. The weekly run is what catches old code with queries that were
    # published after that code was merged.
    - cron: "27 3 * * 1"

# Supersede an in-flight run when a PR branch gets another push, but never cancel
# a push run, so every commit that lands on main or dev keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # Nothing here needs macOS. A scan of this repo takes a few minutes, so this
    # is a hang guard with room to spare rather than a target.
    timeout-minutes: 20

    permissions:
      security-events: write # upload the SARIF results to code scanning
      contents: read # check out the source
      actions: read # read workflow run metadata
      packages: read # pull the CodeQL query packs

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            # Nothing to compile. CodeQL reads the source directly.
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # The default suite plus its lower severity and precision queries. The
          # codebase is small enough that the extra findings stay reviewable.
          # This was originally chosen for api/send-contact.ts, which built an
          # HTML email out of submitted input; that endpoint has since been
          # deleted, so the suite is now kept for the client-side code rather
          # than for any server input path. Drop this line to go back to the
          # default suite.
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
