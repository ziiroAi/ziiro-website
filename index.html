    <!-- The hero's entrance hides its own elements until anime.js reveals

    <script>document.documentElement.classList.add("js");</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load font CSS async so it doesn't block first paint.

         Two families are downloaded, and only two. The text face is Helvetica,
         which every target platform already has, so headlines and body cost no
         request at all: macOS and iOS resolve Helvetica Neue, Windows falls
         back to Arial, which is metrically identical. Instrument Sans and Inter
         used to be fetched here and are gone with the faces they served.

         What is left has to be fetched because nothing local can stand in:
         Space Mono for the tracked uppercase micro-labels, and Instrument
         Serif, upright and italic, for the pull-quote figures.

         The homepage hero adds one more, scoped to the hero's orbit labels
         only (font-hero-mono in tailwind), so no other page changes.
         JetBrains Mono won a measured bake-off against the reference; it is
         variable, so one latin woff2 covers 400 and 500. Families stay
         alphabetical in this URL: css2 answers 400 to an out-of-order list.

         The homepage's one preload, the brain image, is not here: this
         template is shared by every route and no other route uses it.
         HeroStage emits it through Helmet, so it lands in the homepage's
         prerendered head only. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />
    </noscript>

    <!-- Favicon: the Z mark on the brand's white ground. SVG where it is
         supported, PNG and ICO behind it for everything else.

         GOOGLE IGNORES THE SVG, so the two rasters decide the icon next to
         ziiroai.com in search results. Google Search Central lists the formats
         it takes and SVG is not among them: "Google Search supports the
         following favicon file formats: BMP, GIF, ICO, PNG, JPEG, PPM, and
         TIFF."

         THE SIZE RULE, CORRECTED. An earlier version of this comment said
         Google "wants a square whose side is a MULTIPLE OF 48" and treated
         the old 128x128 PNG as failing it. That rule is not in Google's
         documentation and the claim was wrong. What the documentation says is:
         "Your favicon must be a square (1:1 aspect ratio) that's at least
         8x8px. While the minimum size requirement is 8x8px, we recommend using
         a favicon that's larger than 48x48px so that it looks good on various
         surfaces." 128x128 already met that. 192 is kept because it is square
         and comfortably above the recommended floor, not because 128 was
         broken.

         So the rule to hold to is the documented one: keep these SQUARE and
         keep them well above 48x48. If a sizes attribute and the file it
         points at ever disagree, the attribute is the lie.

         Composition is 37.23% ink, taken from the supplied artwork; see the
         note in public/favicon.svg, which is the source the other two are
         rasterised from. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
